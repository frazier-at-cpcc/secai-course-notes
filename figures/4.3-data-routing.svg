<rect x="326" y="52" width="150" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="401" y="75" text-anchor="middle" font-size="10" font-weight="800" fill="#1a1209" letter-spacing="0.8">INTERNAL</text>
<path d="M476 71H515" fill="none" stroke="#1a1209" stroke-width="2" marker-end="url(#dr-i)"/>
<rect x="520.5" y="54.5" width="234" height="38" rx="7" fill="#1a1209"/>
<rect x="518" y="52" width="234" height="38" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="635.0" y="69.0" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Enterprise tenant</text>
<text x="635.0" y="80.8" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">no-training contract, SSO</text>
