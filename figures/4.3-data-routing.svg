<rect x="326" y="6" width="150" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="401" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="#1a1209" letter-spacing="0.8">PUBLIC</text>
<path d="M476 25H515" fill="none" stroke="#1a1209" stroke-width="2" marker-end="url(#dr-i)"/>
<rect x="520.5" y="8.5" width="234" height="38" rx="7" fill="#1a1209"/>
<rect x="518" y="6" width="234" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="635.0" y="22.9" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Public or enterprise model</text>
<text x="635.0" y="34.8" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">any approved tool</text>
