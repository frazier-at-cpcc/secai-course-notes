<rect x="520.5" y="146.5" width="234" height="38" rx="7" fill="#1a1209"/>
<rect x="518" y="144" width="234" height="38" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="635.0" y="160.9" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Self-hosted private model</text>
<text x="635.0" y="172.8" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">data never leaves</text>
<path d="M284 114H302V209H323" fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#dr-r)"/>
