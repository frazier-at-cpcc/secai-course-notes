<text x="209.0" y="95.4" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">AI gateway</text>
<text x="209.0" y="107.5" text-anchor="middle" font-size="9" font-weight="700" fill="#efe6ff">classify the content</text>
<text x="209.0" y="118.8" text-anchor="middle" font-size="9" font-weight="700" fill="#efe6ff">redact what policy</text>
<text x="209.0" y="130.1" text-anchor="middle" font-size="9" font-weight="700" fill="#efe6ff">allows; block secrets</text>
<text x="209.0" y="141.3" text-anchor="middle" font-size="9" font-weight="700" fill="#efe6ff">log the decision</text>
