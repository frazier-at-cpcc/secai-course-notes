<path d="M476 209H515" fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#dr-r)"/>
<rect x="520.5" y="192.5" width="234" height="38" rx="7" fill="#1a1209"/>
<rect x="518" y="190" width="234" height="38" rx="7" fill="#fffae0" stroke="#9a3412" stroke-width="2"/>
<text x="635.0" y="206.9" text-anchor="middle" font-size="11" font-weight="800" fill="#9a3412">Blocked</text>
<text x="635.0" y="218.8" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">user coached, event logged</text>
<text x="401" y="244" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5c4a30" letter-spacing="1.2">DATA CLASS</text>
<text x="635" y="244" text-anchor="middle" font-size="9.5" font-weight="800" fill="#5c4a30" letter-spacing="1.2">ALLOWED DESTINATION</text>
