<svg viewBox="0 0 760 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An AI gateway classifies each prompt and routes it to a model tier approved for that data class, or blocks it">
<defs><marker id="dr-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker><marker id="dr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker><marker id="dr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker></defs>
<rect x="10.5" y="86.5" width="96" height="60" rx="7" fill="#1a1209"/>
<rect x="8" y="84" width="96" height="60" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="56.0" y="112.3" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Prompt</text>
<text x="56.0" y="124.4" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">plus any files</text>
<path d="M104 114H131" fill="none" stroke="#1a1209" stroke-width="2" marker-end="url(#dr-i)"/>
