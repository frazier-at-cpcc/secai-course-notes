<rect x="518" y="98" width="234" height="38" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="635.0" y="115.0" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Enterprise tenant, home region</text>
<text x="635.0" y="126.8" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">regional processing pinned</text>
