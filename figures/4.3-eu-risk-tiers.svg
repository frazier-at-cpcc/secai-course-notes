<svg viewBox="0 0 360 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EU AI Act risk tiers from unacceptable to minimal, with general-purpose AI models as a separate track">
<rect x="105.5" y="10.5" width="150" height="42" rx="7" fill="#1a1209"/>
<rect x="103.0" y="8" width="150" height="42" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="178.0" y="27.3" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Unacceptable</text>
<text x="178.0" y="39.4" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">banned (Article 5)</text>
<rect x="72.5" y="58.5" width="216" height="42" rx="7" fill="#1a1209"/>
<rect x="70.0" y="56" width="216" height="42" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="178.0" y="75.3" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">High risk</text>
<text x="178.0" y="87.4" text-anchor="middle" font-size="9" font-weight="700" fill="#efe6ff">conformity assessment before market</text>
<rect x="39.5" y="106.5" width="282" height="42" rx="7" fill="#1a1209"/>
<rect x="37.0" y="104" width="282" height="42" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="178.0" y="123.3" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Limited risk</text>
<text x="178.0" y="135.4" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">transparency duties (Article 50)</text>
<rect x="6.5" y="154.5" width="348" height="42" rx="7" fill="#1a1209"/>
<rect x="4.0" y="152" width="348" height="42" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="178.0" y="171.3" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Minimal risk</text>
<text x="178.0" y="183.4" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">no new obligations; voluntary codes</text>
<rect x="6" y="206" width="346" height="44" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2" stroke-dasharray="5 3"/>
<text x="179.0" y="225.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1a1209">General-purpose AI models: separate track</text>
<text x="179.0" y="237.5" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">systemic risk presumed above 10<tspan dy="-4" font-size="7">25</tspan><tspan dy="4"> training FLOPs</tspan></text>
</svg>
