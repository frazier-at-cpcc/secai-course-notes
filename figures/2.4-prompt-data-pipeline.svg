<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A customer record is classified, minimized, pseudonymized, masked, and redacted before it becomes part of a prompt">
  <defs><marker id="ds-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker></defs>
  <path d="M5 22V14H624V22" fill="none" stroke="#5c4a30" stroke-width="1.5"/>
  <text x="314.5" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.4" fill="#5c4a30">INSIDE YOUR BOUNDARY: RAW RECORD, KEYS, LOOKUP TABLES</text>
  <path d="M640 22V14H754V22" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="697" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.4" fill="#6d28d9">TO THE MODEL</text>
  <rect x="7.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="5" y="30" width="114" height="96" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="62.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Classify</text>
  <text x="62.0" y="74" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">label every field</text>
  <text x="62.0" y="91" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">card: Restricted</text>
  <text x="62.0" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">plan: Internal</text>
  <path d="M120 78.0H130" stroke="#1a1209" stroke-width="2" marker-end="url(#ds-ink)"/>
  <rect x="134.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="132" y="30" width="114" height="96" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="189.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Minimize</text>
  <text x="189.0" y="74" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30" class="mono">9 fields arrive</text>
  <path d="M189.0 82V92" stroke="#5c4a30" stroke-width="1.5" marker-end="url(#ds-ink)"/>
  <text x="189.0" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">3 fields + ticket</text>
  <path d="M247 78.0H257" stroke="#1a1209" stroke-width="2" marker-end="url(#ds-ink)"/>
  <rect x="261.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="259" y="30" width="114" height="96" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="316.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Pseudonymize</text>
  <text x="316.0" y="74" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30" class="mono">C-20417</text>
  <path d="M316.0 82V92" stroke="#5c4a30" stroke-width="1.5" marker-end="url(#ds-ink)"/>
  <text x="316.0" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">cust_7d9f0c884bf5</text>
  <path d="M374 78.0H384" stroke="#1a1209" stroke-width="2" marker-end="url(#ds-ink)"/>
  <rect x="388.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="386" y="30" width="114" height="96" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="443.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Mask</text>
  <text x="443.0" y="74" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30" class="mono">4111 1111 1111 1111</text>
  <path d="M443.0 82V92" stroke="#5c4a30" stroke-width="1.5" marker-end="url(#ds-ink)"/>
  <text x="443.0" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">**** **** **** 1111</text>
  <path d="M501 78.0H511" stroke="#1a1209" stroke-width="2" marker-end="url(#ds-ink)"/>
  <rect x="515.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="513" y="30" width="114" height="96" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
  <text x="570.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1209">Redact</text>
  <text x="570.0" y="74" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30" class="mono">dana@example.com</text>
  <path d="M570.0 82V92" stroke="#5c4a30" stroke-width="1.5" marker-end="url(#ds-ink)"/>
  <text x="570.0" y="105" text-anchor="middle" font-size="9" font-weight="700" fill="#3a1d70" class="mono">[EMAIL]</text>
  <path d="M628 78.0H638" stroke="#1a1209" stroke-width="2" marker-end="url(#ds-ink)"/>
  <rect x="642.5" y="32.5" width="114" height="96" rx="7" fill="#1a1209"/><rect x="640" y="30" width="114" height="96" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
  <text x="697.0" y="52" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Prompt</text>
  <text x="697.0" y="74" text-anchor="middle" font-size="9.5" font-weight="700" fill="#efe6ff">customer token</text>
  <text x="697.0" y="88" text-anchor="middle" font-size="9.5" font-weight="700" fill="#efe6ff">masked card</text>
  <text x="697.0" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#efe6ff">plan</text>
  <text x="697.0" y="116" text-anchor="middle" font-size="9.5" font-weight="700" fill="#efe6ff">redacted ticket</text>
  <text x="314.5" y="150" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">Labels decide the rule for each field. Dropped: name, email, phone, ssn, dob, zip.</text>
  <text x="314.5" y="163" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5c4a30">The pseudonymization key and token table stay with the data owner.</text>
</svg>
