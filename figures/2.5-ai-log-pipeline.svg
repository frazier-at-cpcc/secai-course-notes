<svg viewBox="0 0 760 206" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An AI gateway counts requests, checks the query and the response, sanitizes both, and writes a hash-chained log record that is forwarded to the SIEM">
<defs>
<marker id="lp-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
<marker id="lp-pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
</defs>
<g text-anchor="middle">
<!-- clients -->
<rect x="12.5" y="32.5" width="108" height="70" rx="7" fill="#1a1209"/><rect x="10" y="30" width="108" height="70" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="64" y="61" font-size="13" font-weight="800" fill="#1a1209">Clients</text>
<text x="64" y="77" font-size="9.5" font-weight="600" fill="#5c4a30">help desk, SOC</text>
<!-- gateway -->
<rect x="172.5" y="16.5" width="410" height="102" rx="7" fill="#1a1209"/><rect x="170" y="14" width="410" height="102" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
<text x="375" y="33" font-size="13" font-weight="800" fill="#1a1209">AI gateway</text>
<rect x="180" y="44" width="91.5" height="60" rx="6" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="225.75" y="69" font-size="11" font-weight="800" fill="#1a1209">Rate</text>
<text x="225.75" y="85" font-size="9" font-weight="600" fill="#5c4a30">count per client</text>
<rect x="279.5" y="44" width="91.5" height="60" rx="6" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="325.25" y="69" font-size="11" font-weight="800" fill="#1a1209">Query</text>
<text x="325.25" y="85" font-size="9" font-weight="600" fill="#5c4a30">injection, PII</text>
<rect x="379" y="44" width="91.5" height="60" rx="6" fill="#fff" stroke="#1a1209" stroke-width="1.5"/>
<text x="424.75" y="69" font-size="11" font-weight="800" fill="#1a1209">Response</text>
<text x="424.75" y="85" font-size="9" font-weight="600" fill="#5c4a30">leaks, confidence</text>
<rect x="478.5" y="44" width="91.5" height="60" rx="6" fill="#ffd60a" stroke="#1a1209" stroke-width="1.5"/>
<text x="524.25" y="69" font-size="11" font-weight="800" fill="#1a1209">Sanitize</text>
<text x="524.25" y="85" font-size="9" font-weight="700" fill="#1a1209">redact, then hash</text>
<!-- model -->
<rect x="632.5" y="32.5" width="118" height="70" rx="7" fill="#1a1209"/><rect x="630" y="30" width="118" height="70" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="689" y="61" font-size="13" font-weight="800" fill="#fff">Model</text>
<text x="689" y="77" font-size="9.5" font-weight="600" fill="#efe6ff" class="mono">qwen2.5:0.5b</text>
<!-- lane labels -->
<text x="144" y="47" font-size="9" font-weight="700" fill="#1a1209">query</text>
<text x="605" y="47" font-size="9" font-weight="700" fill="#1a1209">query</text>
<text x="144" y="99" font-size="9" font-weight="700" fill="#6d28d9">response</text>
<text x="605" y="99" font-size="9" font-weight="700" fill="#6d28d9">response</text>
</g>
<g stroke-width="2" fill="none">
<path d="M120 54H167" stroke="#1a1209" marker-end="url(#lp-ink)"/>
<path d="M582 54H627" stroke="#1a1209" marker-end="url(#lp-ink)"/>
<path d="M630 84H585" stroke="#6d28d9" marker-end="url(#lp-pur)"/>
<path d="M170 84H123" stroke="#6d28d9" marker-end="url(#lp-pur)"/>
</g>
<!-- log chain -->
<g text-anchor="middle">
<text x="96" y="156" font-size="11" font-weight="800" fill="#1a1209">Sanitized log</text>
<text x="96" y="171" font-size="9" font-weight="600" fill="#5c4a30">hash-chained, chmod 600</text>
<text x="96" y="185" font-size="9.5" font-weight="600" fill="#6d28d9" class="mono">audit.jsonl</text>
<rect x="202.5" y="146.5" width="94" height="46" rx="7" fill="#1a1209"/><rect x="200" y="144" width="94" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="247" y="163" font-size="10.5" font-weight="800" fill="#1a1209">record 1</text>
<text x="247" y="179" font-size="9" font-weight="600" fill="#5c4a30" class="mono">prev = 000</text>
<rect x="326.5" y="146.5" width="94" height="46" rx="7" fill="#1a1209"/><rect x="324" y="144" width="94" height="46" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="371" y="163" font-size="10.5" font-weight="800" fill="#1a1209">record 2</text>
<text x="371" y="179" font-size="9" font-weight="600" fill="#5c4a30" class="mono">prev = h(1)</text>
<rect x="450.5" y="146.5" width="94" height="46" rx="7" fill="#1a1209"/><rect x="448" y="144" width="94" height="46" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="495" y="163" font-size="10.5" font-weight="800" fill="#1a1209">record 3</text>
<text x="495" y="179" font-size="9" font-weight="600" fill="#5c4a30" class="mono">prev = h(2)</text>
<rect x="632.5" y="146.5" width="118" height="46" rx="7" fill="#1a1209"/><rect x="630" y="144" width="118" height="46" rx="7" fill="#3a1d70" stroke="#1a1209" stroke-width="2"/>
<text x="689" y="163" font-size="11" font-weight="800" fill="#fff">SIEM</text>
<text x="689" y="179" font-size="9" font-weight="600" fill="#efe6ff">alerts, review</text>
</g>
<g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#lp-ink)">
<path d="M524 118V140"/>
<path d="M324 167H298"/>
<path d="M448 167H422"/>
<path d="M544 167H626"/>
</g>
<text x="531" y="133" font-size="9" font-weight="700" fill="#1a1209">write</text>
<text x="585" y="161" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1209">forward</text>
</svg>
