<svg viewBox="0 0 760 234" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An agent proposes a tool call; an AI gateway authenticates the service identity, checks scope, the tool allowlist, and data attributes, then forwards the call or denies and audits it">
  <defs>
    <marker id="ag-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
    <marker id="ag-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
  </defs>
  <!-- zone labels -->
  <path d="M10 22V14H306V22" fill="none" stroke="#5c4a30" stroke-width="1.5"/>
  <text x="158" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.4" fill="#5c4a30">UNTRUSTED: MODEL OUTPUT</text>
  <path d="M340 22V14H750V22" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="545" y="10" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.4" fill="#6d28d9">ENFORCED: POLICY OUTSIDE THE MODEL</text>
  <!-- trust boundary -->
  <path d="M323 26V200" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g text-anchor="middle" font-weight="800">
    <!-- user -->
    <rect x="12.5" y="72.5" width="118" height="70" rx="7" fill="#1a1209"/><rect x="10" y="70" width="118" height="70" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="69" y="98" font-size="13" fill="#1a1209">User</text>
    <text x="69" y="114" font-size="9.5" font-weight="600" fill="#5c4a30">help desk chat</text>
    <text x="69" y="127" font-size="9.5" font-weight="600" fill="#5c4a30">"reset jdoe"</text>
    <!-- agent -->
    <rect x="168.5" y="72.5" width="138" height="70" rx="7" fill="#1a1209"/><rect x="166" y="70" width="138" height="70" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
    <text x="235" y="94" font-size="13" fill="#1a1209">Agent (LLM)</text>
    <text x="235" y="110" font-size="9.5" font-weight="600" fill="#5c4a30">proposes a tool call</text>
    <text x="235" y="127" font-size="9.5" font-weight="700" fill="#3a1d70" class="mono">reset_password</text>
    <!-- gateway -->
    <rect x="342.5" y="34.5" width="184" height="148" rx="7" fill="#1a1209"/><rect x="340" y="32" width="184" height="148" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
    <text x="432" y="54" font-size="13" fill="#1a1209">AI gateway</text>
  </g>
  <g font-size="10" font-weight="700" fill="#1a1209">
    <text x="354" y="76">1  Authenticate the key</text>
    <text x="368" y="88" font-size="9" font-weight="600" fill="#5c4a30">svc-helpdesk-bot</text>
    <text x="354" y="106">2  Check scope</text>
    <text x="354" y="124">3  Tool allowlist</text>
    <text x="354" y="142">4  Filter data by</text>
    <text x="368" y="154" font-size="9" font-weight="600" fill="#5c4a30">caller dept and level</text>
    <text x="354" y="172">5  Write audit record</text>
  </g>
  <g text-anchor="middle" font-weight="800">
    <!-- resources -->
    <rect x="590.5" y="34.5" width="158" height="38" rx="7" fill="#1a1209"/><rect x="588" y="32" width="158" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="667" y="56" font-size="11.5" fill="#1a1209">Tools and APIs</text>
    <rect x="590.5" y="89.5" width="158" height="38" rx="7" fill="#1a1209"/><rect x="588" y="87" width="158" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="667" y="111" font-size="11.5" fill="#1a1209">Model endpoints</text>
    <rect x="590.5" y="144.5" width="158" height="38" rx="7" fill="#1a1209"/><rect x="588" y="142" width="158" height="38" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
    <text x="667" y="166" font-size="11.5" fill="#1a1209">Vector store (RAG)</text>
    <!-- deny box -->
    <rect x="342.5" y="200.5" width="184" height="30" rx="7" fill="#1a1209"/><rect x="340" y="198" width="184" height="30" rx="7" fill="#fff" stroke="#9a3412" stroke-width="2"/>
    <text x="432" y="217" font-size="10.5" fill="#9a3412">403 deny, logged</text>
  </g>
  <!-- arrows -->
  <g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#ag-ink)">
    <path d="M129 105H163"/>
    <path d="M305 105H336"/>
    <path d="M525 60H584"/>
    <path d="M525 106H584"/>
    <path d="M525 152H584"/>
  </g>
  <path d="M432 181V194" fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#ag-rust)"/>
  <text x="235" y="176" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">tool call + bot's key</text>
  <text x="235" y="188" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">(it cannot pick its identity)</text>
  <text x="555" y="53" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">allowed</text>
</svg>
