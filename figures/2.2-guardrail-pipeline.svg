<text x="437" y="148" text-anchor="middle" font-size="10" font-weight="800" fill="#9a3412">BLOCKED: return a refusal, log the verdict and the layer that fired</text>
<text x="437" y="161" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">Fail closed: a guard that errors or times out counts as a block</text>
