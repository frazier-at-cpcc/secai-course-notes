<rect x="8.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="6" y="38" width="104" height="58" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="58.0" y="64.3" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">User prompt</text>
<text x="58.0" y="77.3" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">untrusted text</text>
<rect x="134.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="132" y="38" width="104" height="58" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="184.0" y="58.3" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Input guard</text>
<text x="184.0" y="71.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">llama-guard3:1b</text>
<text x="184.0" y="83.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">safe or unsafe Sn</text>
<rect x="260.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="258" y="38" width="104" height="58" rx="7" fill="#fffae0" stroke="#1a1209" stroke-width="2"/>
<text x="310.0" y="58.3" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Prompt template</text>
<text x="310.0" y="71.3" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">rules + fenced</text>
<text x="310.0" y="83.3" text-anchor="middle" font-size="9" font-weight="600" fill="#5c4a30">user input</text>
<rect x="386.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="384" y="38" width="104" height="58" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="436.0" y="64.3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Model</text>
<text x="436.0" y="77.3" text-anchor="middle" font-size="9" font-weight="600" fill="#efe6ff">qwen2.5:0.5b</text>
<rect x="512.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="510" y="38" width="104" height="58" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="562.0" y="58.3" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Output filter</text>
<text x="562.0" y="71.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">canary regex</text>
<text x="562.0" y="83.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">STAFF-\d{4}</text>
<rect x="638.5" y="40.5" width="104" height="58" rx="7" fill="#1a1209"/><rect x="636" y="38" width="104" height="58" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="688.0" y="58.3" text-anchor="middle" font-size="11" font-weight="800" fill="#1a1209">Output guard</text>
<text x="688.0" y="71.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">llama-guard3:1b</text>
<text x="688.0" y="83.3" text-anchor="middle" font-size="9" font-weight="600" fill="#1a1209">judges the reply</text>
