<text x="58.0" y="35" font-size="11" font-weight="800" fill="#1a1209">Caller</text>
<text x="58.0" y="51" font-size="9" font-weight="700" fill="#5c4a30">user, app,</text>
<text x="58.0" y="63" font-size="9" font-weight="700" fill="#5c4a30">or agent</text>
<rect x="119.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="117" y="12" width="96" height="64" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="165.0" y="35" font-size="11" font-weight="800" fill="#1a1209">API gateway</text>
<text x="165.0" y="51" font-size="9" font-weight="700" fill="#1a1209">access control,</text>
<text x="165.0" y="63" font-size="9" font-weight="700" fill="#1a1209">rate limiting</text>
<rect x="226.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="224" y="12" width="96" height="64" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="272.0" y="35" font-size="11" font-weight="800" fill="#1a1209">Prompt firewall</text>
<text x="272.0" y="51" font-size="9" font-weight="700" fill="#1a1209">screens input</text>
<text x="272.0" y="63" font-size="9" font-weight="700" fill="#1a1209">and output</text>
<rect x="333.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="331" y="12" width="96" height="64" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="379.0" y="35" font-size="11" font-weight="800" fill="#1a1209">Template</text>
<text x="379.0" y="51" font-size="9" font-weight="700" fill="#1a1209">fixed slots,</text>
<text x="379.0" y="63" font-size="9" font-weight="700" fill="#1a1209">delimiters</text>
<rect x="440.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="438" y="12" width="96" height="64" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="486.0" y="35" font-size="11" font-weight="800" fill="#fff">Model</text>
<text x="486.0" y="51" font-size="9" font-weight="700" fill="#efe6ff">guardrails,</text>
<text x="486.0" y="63" font-size="9" font-weight="700" fill="#efe6ff">safety tuning</text>
<rect x="547.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="545" y="12" width="96" height="64" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="593.0" y="35" font-size="11" font-weight="800" fill="#1a1209">Output check</text>
<text x="593.0" y="51" font-size="9" font-weight="700" fill="#1a1209">escape, redact,</text>
<text x="593.0" y="63" font-size="9" font-weight="700" fill="#1a1209">allowlist links</text>
<rect x="654.5" y="14.5" width="96" height="64" rx="7" fill="#1a1209"/><rect x="652" y="12" width="96" height="64" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="700.0" y="35" font-size="11" font-weight="800" fill="#1a1209">Tools and data</text>
<text x="700.0" y="51" font-size="9" font-weight="700" fill="#1a1209">least privilege,</text>
<text x="700.0" y="63" font-size="9" font-weight="700" fill="#1a1209">human approval</text>
