<text x="165.0" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">jailbreak retries</text>
<rect x="224" y="88" width="96" height="58" rx="6" fill="#fffae0" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="272.0" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">direct injection</text>
<text x="272.0" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">circumvention</text>
<text x="272.0" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">jailbreak phrasing</text>
<rect x="331" y="88" width="96" height="58" rx="6" fill="#fffae0" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="379.0" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">indirect injection</text>
<text x="379.0" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">hidden markup</text>
<rect x="438" y="88" width="96" height="58" rx="6" fill="#fffae0" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="486.0" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">harmful requests</text>
<text x="486.0" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">policy-violating</text>
<text x="486.0" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">output</text>
<rect x="545" y="88" width="96" height="58" rx="6" fill="#fffae0" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="593.0" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">insecure output</text>
<text x="593.0" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">handling</text>
<text x="593.0" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">data disclosure</text>
<rect x="652" y="88" width="96" height="58" rx="6" fill="#fffae0" stroke="#d8d2c8" stroke-width="1.5"/>
<text x="700.0" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">excessive agency</text>
<text x="700.0" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">insecure plug-ins</text>
<text x="700.0" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3412">integration abuse</text>
<rect x="119.5" y="162.5" width="631" height="52" rx="7" fill="#1a1209"/><rect x="117" y="160" width="631" height="52" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="432.5" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#3a1d70">Underneath every layer: training data, RAG index, model weights, logs</text>
<text x="432.5" y="198" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1209">Data integrity controls (hashes, signing, validation) and encryption (at rest, in transit) against poisoning, tampering, and theft</text>
<text x="58.0" y="184" text-anchor="middle" font-size="9" font-weight="800" fill="#5c4a30">DATA</text>
<text x="58.0" y="196" text-anchor="middle" font-size="9" font-weight="800" fill="#5c4a30">LAYER</text>
