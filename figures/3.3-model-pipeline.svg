<svg viewBox="0 0 760 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A CI/CD pipeline for an AI system: push, code scan, software composition analysis, unit tests, model tests, and deploy; a failure at any gate keeps the last good model in production">
<defs>
<marker id="mp-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1209"/></marker>
<marker id="mp-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker>
</defs>
<g text-anchor="middle">
<rect x="7.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="5" y="20" width="106" height="66" rx="7" fill="#fff" stroke="#1a1209" stroke-width="2"/>
<text x="58" y="48" font-size="12.5" font-weight="800" fill="#1a1209">Push</text>
<text x="58" y="64" font-size="9" font-weight="600" fill="#5c4a30">code, data, model</text>
<rect x="135.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="133" y="20" width="106" height="66" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="186" y="48" font-size="12.5" font-weight="800" fill="#1a1209">Code scan</text>
<text x="186" y="64" font-size="9.5" font-weight="600" fill="#1a1209" class="mono">bandit</text>
<rect x="263.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="261" y="20" width="106" height="66" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="314" y="48" font-size="12.5" font-weight="800" fill="#1a1209">SCA</text>
<text x="314" y="64" font-size="9.5" font-weight="600" fill="#1a1209" class="mono">pip-audit</text>
<rect x="391.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="389" y="20" width="106" height="66" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="442" y="48" font-size="12.5" font-weight="800" fill="#1a1209">Unit tests</text>
<text x="442" y="64" font-size="9.5" font-weight="600" fill="#1a1209" class="mono">pytest</text>
<rect x="519.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="517" y="20" width="106" height="66" rx="7" fill="#ffd60a" stroke="#1a1209" stroke-width="2"/>
<text x="570" y="46" font-size="12.5" font-weight="800" fill="#1a1209">Model tests</text>
<text x="570" y="61" font-size="9" font-weight="700" fill="#1a1209">accuracy floor</text>
<text x="570" y="73" font-size="9" font-weight="700" fill="#1a1209">no regression</text>
<rect x="647.5" y="22.5" width="106" height="66" rx="7" fill="#1a1209"/><rect x="645" y="20" width="106" height="66" rx="7" fill="#6d28d9" stroke="#1a1209" stroke-width="2"/>
<text x="698" y="48" font-size="12.5" font-weight="800" fill="#fff">Deploy</text>
<text x="698" y="64" font-size="9" font-weight="600" fill="#efe6ff">repoint current</text>
<!-- fail bracket -->
<text x="384" y="120" text-anchor="start" font-size="9.5" font-weight="800" fill="#9a3412">ANY GATE FAILS</text>
<rect x="290.5" y="140.5" width="176" height="46" rx="7" fill="#1a1209"/><rect x="288" y="138" width="176" height="46" rx="7" fill="#fff" stroke="#9a3412" stroke-width="2"/>
<text x="376" y="157" font-size="11" font-weight="800" fill="#9a3412">Stop the release</text>
<text x="376" y="172" font-size="9" font-weight="600" fill="#5c4a30">production keeps the last good model</text>
<!-- registry -->
<rect x="603.5" y="130.5" width="150" height="56" rx="7" fill="#1a1209"/><rect x="601" y="128" width="150" height="56" rx="7" fill="#efe6ff" stroke="#1a1209" stroke-width="2"/>
<text x="676" y="146" font-size="11" font-weight="800" fill="#1a1209">Model registry</text>
<text x="676" y="161" font-size="9" font-weight="600" fill="#5c4a30">v1, v2, v3 kept</text>
<text x="676" y="174" font-size="9" font-weight="600" fill="#5c4a30">rollback = repoint</text>
</g>
<g stroke="#1a1209" stroke-width="2" fill="none" marker-end="url(#mp-ink)">
<path d="M111 53H129"/>
<path d="M239 53H257"/>
<path d="M367 53H385"/>
<path d="M495 53H513"/>
<path d="M623 53H641"/>
</g>
<path d="M698 88V124" stroke="#1a1209" stroke-width="2" fill="none" marker-start="url(#mp-ink)" marker-end="url(#mp-ink)"/>
<path d="M133 92V102H623V92" fill="none" stroke="#9a3412" stroke-width="1.5"/>
<path d="M376 102V134" fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#mp-rust)"/>
</svg>
